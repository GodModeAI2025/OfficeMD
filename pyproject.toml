[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carrymark"
version = "0.2.0"
description = "Markdown (via microsoft/markitdown) in DOCX, XLSX und PPTX einbetten und aktuell halten"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["markitdown[docx,xlsx,pptx]>=0.1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
carrymark = "carrymark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
